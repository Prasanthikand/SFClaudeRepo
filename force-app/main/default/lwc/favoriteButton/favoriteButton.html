<template>
    <template if:true={isLoading}>
        <lightning-spinner
            alternative-text="Loading"
            size="small"
        ></lightning-spinner>
    </template>
    <template if:false={isLoading}>
        <lightning-button
            label={buttonLabel}
            onclick={handleToggle}
            variant="neutral"
        >
        </lightning-button>
    </template>
</template>
