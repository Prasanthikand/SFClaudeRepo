<template>
    <template if:true={hasError}>
        <c-error-panel></c-error-panel>
    </template>
    <template if:false={hasError}>
        <template if:true={hasFavorites}>
            <div class="slds-grid slds-wrap slds-gutters">
                <template for:each={favorites.data} for:item="property">
                    <div
                        key={property.Id}
                        class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3"
                    >
                        <c-property-tile
                            property={property}
                            onselected={handlePropertySelected}
                        >
                        </c-property-tile>
                    </div>
                </template>
            </div>
        </template>
        <template if:false={hasFavorites}>
            <p class="slds-text-body_regular slds-m-around_medium">
                You have no saved favorites yet.
            </p>
        </template>
    </template>
</template>
